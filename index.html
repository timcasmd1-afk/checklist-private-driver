<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Tugas Harian OB</title>
<style>
  :root{
    --navy:#1F3864; --blue:#2F5496; --light:#EAF0FA; --line:#C9D4E8;
    --ink:#1c2330; --muted:#6b7690; --sched:#FFF3C4; --done:#2E9E5B; --sun:#F3E3E3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:#dfe4ea;}
  body{font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#f5f7fb;
       max-width:480px; margin:0 auto; min-height:100vh; box-shadow:0 0 18px rgba(0,0,0,.12); padding-bottom:20px;}

  /* Header ala aplikasi HP */
  header{background:var(--navy); color:#fff; padding:12px 14px 0; position:sticky; top:0; z-index:10;}
  header h1{font-size:16px; text-align:center; letter-spacing:.3px;}
  .tabs{display:flex; margin-top:10px;}
  .tabs button{flex:1; background:transparent; color:#cfe0f3; border:none; padding:10px 4px; font-size:13px; cursor:pointer; border-bottom:3px solid transparent; font-family:inherit;}
  .tabs button.active{color:#fff; border-bottom-color:#4da3ff; font-weight:bold;}

  .petugas{display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--light); border-bottom:1px solid var(--line);}
  .petugas label{font-size:13px; font-weight:bold; color:var(--navy); white-space:nowrap;}
  .petugas input{flex:1; font:inherit; font-size:15px; padding:9px 12px; border:1px solid var(--line); border-radius:8px;}
  .petugas input:focus{outline:2px solid var(--blue); border-color:var(--blue);}

  .page{display:none; padding:12px;}
  .page.active{display:block;}

  /* ===== Tampilan Harian ===== */
  .datebar{display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:10px;}
  .datebar button{background:var(--light); border:1px solid var(--line); border-radius:8px; font-size:18px; width:44px; height:40px; cursor:pointer; color:var(--navy);}
  .datebar .dt{text-align:center; flex:1;}
  .datebar .dt .dow{font-size:12px; color:var(--muted);}
  .datebar .dt .tgl{font-size:16px; font-weight:bold; color:var(--navy);}
  .daysum{font-size:12.5px; color:var(--muted); text-align:center; margin-bottom:10px;}
  .sunbanner{background:var(--sun); border:1px solid #dcb9b9; color:#8a3b3b; border-radius:10px; padding:12px; text-align:center; font-size:14px; margin-bottom:10px;}

  .gcard{background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:12px; overflow:hidden;}
  .gcard .ghead{background:var(--navy); color:#fff; padding:9px 12px; font-size:13.5px; font-weight:bold;}
  .trow{display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid #eef1f6;}
  .trow:first-of-type{border-top:none;}
  .trow.sched{background:var(--sched);}
  .trow .info{flex:1; min-width:0;}
  .trow .ket{font-size:14.5px; font-weight:bold;}
  .trow .hari{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .badge{display:inline-block; font-size:10px; font-weight:bold; padding:2px 7px; border-radius:10px; margin-top:4px;}
  .badge.s{background:#e9d98a; color:#6b5900;}
  .badge.k{background:var(--light); color:var(--blue);}
  .slot{width:76px; height:64px; border-radius:8px; border:1.5px dashed var(--blue); background:#f4f8ff; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; flex-shrink:0; overflow:hidden; position:relative;}
  .slot.filled{border:2px solid var(--done); padding:0;}
  .slot img{width:100%; height:100%; object-fit:cover;}
  .slot .delbtn{position:absolute; top:2px; right:2px; width:20px; height:20px; border:none; border-radius:50%; background:rgba(192,0,0,.88); color:#fff; font-size:11px; line-height:20px; padding:0; cursor:pointer; z-index:2;}

  /* ===== Rekap Bulanan ===== */
  .rekapbar{display:flex; gap:8px; margin-bottom:10px;}
  select{flex:1; font:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff;}
  .legend{display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--muted); margin-bottom:8px;}
  .legend span{display:inline-flex; align-items:center; gap:4px;}
  .sw{width:12px; height:12px; border:1px solid var(--line); border-radius:3px; display:inline-block;}
  .sw.sched{background:var(--sched);} .sw.sun{background:var(--sun);} .sw.done{background:var(--done);}
  .tblbox{overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:10px;}
  table{border-collapse:collapse; font-size:10px;}
  th,td{border:1px solid var(--line); padding:2px; text-align:center;}
  thead th{background:var(--blue); color:#fff; font-size:9.5px; position:sticky; top:0;}
  thead .dw{font-size:8px; font-weight:normal; opacity:.8; display:block;}
  td.ketc{text-align:left; white-space:nowrap; padding:2px 5px; font-weight:bold; background:var(--light); position:sticky; left:0;}
  td.day{width:30px; min-width:30px; height:28px; padding:1px;}
  td.day.sched{background:var(--sched);}
  td.day.sun{background:var(--sun);}
  td.day.done{background:var(--done);}
  td.day img{width:100%; height:24px; object-fit:cover; border-radius:2px; display:block;}
  .btns{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .btns button{font:inherit; font-size:14px; font-weight:bold; padding:13px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; width:100%;}
  .btns .wa{background:#25D366; color:#fff; border:none;}
  .btns .danger{color:#C00000;}
  .summary{font-size:12px; color:var(--muted); text-align:center; margin-top:10px;}

  /* Modal foto */
  .modal{position:fixed; inset:0; background:rgba(15,20,35,.82); display:none; align-items:center; justify-content:center; z-index:40; padding:16px;}
  .modal.show{display:flex;}
  .modal .box{background:#fff; border-radius:12px; max-width:440px; width:100%; overflow:hidden;}
  .modal .head{background:var(--navy); color:#fff; padding:10px 14px; font-size:13px; font-weight:bold;}
  .modal img{width:100%; max-height:55vh; object-fit:contain; background:#000; display:block;}
  .modal video{width:100%; max-height:55vh; object-fit:contain; background:#000; display:block;}
  .modal .acts{display:flex; gap:8px; padding:12px; flex-wrap:wrap;}
  .modal .acts button{flex:1; font:inherit; font-size:13px; padding:11px 8px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer;}
  .modal .acts button.danger{color:#C00000; border-color:#e3b6b6;}
  .toast{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:50; white-space:nowrap;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
  <header>
    <h1>CHECKLIST TUGAS HARIAN OB</h1>
    <div class="tabs">
      <button id="tabHarian" class="active" onclick="showPage('harian')">📅 Hari Ini</button>
      <button id="tabRekap" onclick="showPage('rekap')">📊 Rekap Bulan</button>
    </div>
  </header>

  <div class="petugas">
    <label for="inpPetugas">Petugas:</label>
    <input type="text" id="inpPetugas" placeholder="Nama petugas..." autocomplete="off">
  </div>

  <!-- ===== HALAMAN HARIAN ===== -->
  <section class="page active" id="pageHarian">
    <div id="harianBox">
      <div class="datebar">
        <button onclick="gantiHari(-1)">◀</button>
        <div class="dt">
          <div class="dow" id="dowLabel"></div>
          <div class="tgl" id="tglLabel"></div>
        </div>
        <button onclick="gantiHari(1)">▶</button>
      </div>
      <div class="daysum" id="daySum"></div>
      <div id="dayList"></div>
    </div>
    <div class="btns">
      <button class="wa" onclick="shareWADay()">📤 Share WA (Hari Ini)</button>
      <button class="danger" onclick="resetDay()">🗑 Hapus Semua Foto (Hari Ini)</button>
    </div>
  </section>

  <!-- ===== HALAMAN REKAP ===== -->
  <section class="page" id="pageRekap">
    <div class="rekapbar">
      <select id="selMonth"></select>
      <select id="selYear"></select>
    </div>
    <div class="legend">
      <span><i class="sw sched"></i> Terjadwal</span>
      <span><i class="sw done"></i> Ada foto</span>
      <span><i class="sw sun"></i> Minggu</span>
      <span>← geser tabel ke samping →</span>
    </div>
    <div class="tblbox" id="rekapBox"><table id="tbl"></table></div>
    <div class="summary" id="summary"></div>
    <div class="btns">
      <button class="wa" onclick="shareWA()">📤 Share WA</button>
      <button class="danger" onclick="resetMonth()">🗑 Hapus Foto Bulan Ini</button>
      <button class="danger" onclick="resetAllPhotos()">🗑 Hapus Semua Foto</button>
    </div>
  </section>

  <div class="modal" id="modal">
    <div class="box">
      <div class="head" id="modalTitle">Bukti Foto</div>
      <img id="modalImg" alt="Bukti foto">
      <div class="acts">
        <button onclick="retakePhoto()">📷 Ganti</button>
        <button class="danger" onclick="deletePhoto()">🗑 Hapus</button>
        <button onclick="closeModal()">Tutup</button>
      </div>
    </div>
  </div>

  <div class="modal" id="cameraModal">
    <div class="box">
      <div class="head">📷 Ambil Foto</div>
      <video id="camVideo" autoplay playsinline muted></video>
      <canvas id="camCanvas" style="display:none;"></canvas>
      <div class="acts">
        <button onclick="capturePhotoFromCamera()">📸 Jepret</button>
        <button class="danger" onclick="closeCameraModal()">Batal</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
// ===== Data tugas (dari Tugas_OB.xlsx) =====
// days: 0=Min,1=Sen,...6=Sab ; null = sesuai kebutuhan
const TASKS = [
 {no:'1', group:true,  tugas:'Kantor Pusat & Kantor Admin', ket:'Meja dan kursi', hari:'Tiap Hari (Sen–Sab)', days:[1,2,3,4,5,6]},
 {no:'',  group:false, tugas:'', ket:'Lantai',  hari:'Tiap Hari (Sen–Sab)', days:[1,2,3,4,5,6]},
 {no:'',  group:false, tugas:'', ket:'Jendela', hari:'Tiap Hari (Sen–Sab)', days:[1,2,3,4,5,6]},
 {no:'2', group:true,  tugas:'Kantor Sales, Kantor Gudang & KM Umum', ket:'Meja dan kursi', hari:'Selasa & Jumat', days:[2,5]},
 {no:'',  group:false, tugas:'', ket:'Lantai', hari:'Selasa & Jumat', days:[2,5]},
 {no:'',  group:false, tugas:'', ket:'Closet (KM umum)', hari:'Selasa & Jumat', days:[2,5]},
 {no:'3', group:true,  tugas:'Kamar Mandi Pusat & Admin', ket:'Washtafel', hari:'Senin & Kamis', days:[1,4]},
 {no:'',  group:false, tugas:'', ket:'Closet (KM Pusat)', hari:'Senin & Kamis', days:[1,4]},
 {no:'',  group:false, tugas:'', ket:'Lantai', hari:'Senin & Kamis', days:[1,4]},
 {no:'4', group:true,  tugas:'Buang Sampah Aqua & OTB', ket:'di TPS', hari:'Selasa, Kamis, Sabtu', days:[2,4,6]},
 {no:'',  group:false, tugas:'', ket:'Tambahan', hari:'Sesuai kebutuhan', days:null},
 {no:'5', group:true,  tugas:'Lainnya', ket:'Bila diperlukan', hari:'Tidak ditentukan', days:null},
];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const NAMAHARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const DW = ['M','S','S','R','K','J','S'];

// ===== Penyimpanan: window.storage (artifact) -> localStorage (file HP) -> memori =====
const mem = {};
const store = {
  async get(k){ try{ if(window.storage){ const r=await window.storage.get(k); return r?r.value:null; } }catch(e){}
                try{ return localStorage.getItem(k); }catch(e){} return mem[k]??null; },
  async set(k,v){ try{ if(window.storage){ await window.storage.set(k,v); return true; } }catch(e){}
                try{ localStorage.setItem(k,v); return true; }catch(e){ if(!window.storage){ mem[k]=v; toast('⚠ Memori penuh — foto tersimpan sementara'); } } return false; },
  async del(k){ try{ if(window.storage){ await window.storage.delete(k); return; } }catch(e){}
                try{ localStorage.removeItem(k); }catch(e){} delete mem[k]; }
};

let photos = {};            // {"r-d": dataURL} bulan aktif
let M, Y, D;                // bulan, tahun, tanggal aktif (harian)
let activeCell = null;

const mkey = () => 'ob-'+Y+'-'+String(M+1).padStart(2,'0');

async function load(){
  photos = {};
  const idxRaw = await store.get(mkey()+'-idx');
  const idx = idxRaw ? JSON.parse(idxRaw) : [];
  for(const id of idx){
    const v = await store.get(mkey()+'-foto-'+id);
    if(v) photos[id] = v;
  }
  renderAll();
  loadPetugas();
}
async function saveIndex(){ await store.set(mkey()+'-idx', JSON.stringify(Object.keys(photos))); }

function renderAll(){ renderHarian(); renderRekap(); }

// ===== Halaman Harian =====
function gantiHari(delta){
  const dt = new Date(Y, M, D + delta);
  const bulanBerubah = dt.getMonth() !== M || dt.getFullYear() !== Y;
  D = dt.getDate(); M = dt.getMonth(); Y = dt.getFullYear();
  document.getElementById('selMonth').value = M;
  document.getElementById('selYear').value = Y;
  if(bulanBerubah) load(); else renderHarian();
}

function renderHarian(){
  const dw = new Date(Y, M, D).getDay();
  document.getElementById('dowLabel').textContent = NAMAHARI[dw];
  document.getElementById('tglLabel').textContent = D+' '+BULAN[M]+' '+Y;

  const list = document.getElementById('dayList');
  if(dw === 0){
    list.innerHTML = '<div class="sunbanner">🏖 Hari Minggu — libur, tidak ada jadwal tugas.</div>';
    document.getElementById('daySum').textContent = '';
    return;
  }

  let html = '', done = 0, sched = 0;
  let openCard = false;
  TASKS.forEach((tk, r) => {
    if(tk.group){
      if(openCard) html += '</div>';
      html += '<div class="gcard"><div class="ghead">'+tk.no+'. '+tk.tugas+'</div>';
      openCard = true;
    }
    const isSched = tk.days && tk.days.includes(dw);
    const foto = photos[r+'-'+D];
    if(isSched){ sched++; if(foto) done++; }
    const badge = tk.days
      ? (isSched ? '<span class="badge s">TERJADWAL HARI INI</span>' : '')
      : '<span class="badge k">SESUAI KEBUTUHAN</span>';
    html += '<div class="trow'+(isSched && !foto ? ' sched':'')+'">'
          + '<div class="info"><div class="ket">'+tk.ket+'</div>'
          + '<div class="hari">'+tk.hari+'</div>'+badge+'</div>'
          + '<div class="slot'+(foto?' filled':'')+'" data-r="'+r+'" data-d="'+D+'">'
          + (foto ? '<img src="'+foto+'" alt="bukti"><button type="button" class="delbtn" onclick="event.stopPropagation(); quickDeletePhoto('+r+','+D+')">🗑</button>' : '📷')
          + '</div></div>';
  });
  if(openCard) html += '</div>';
  list.innerHTML = html;
  document.getElementById('daySum').textContent = 'Bukti foto hari ini: '+done+' dari '+sched+' tugas terjadwal';
}

document.getElementById('dayList').addEventListener('click', e => {
  const slot = e.target.closest('.slot');
  if(!slot) return;
  activeCell = { r:+slot.dataset.r, d:+slot.dataset.d };
  const id = activeCell.r+'-'+activeCell.d;
  if(photos[id]) openModal(id);
  else openCamera();          // buka kamera senyap (tanpa suara jepretan)
});

// ===== Halaman Rekap =====
function renderRekap(){
  const nDays = new Date(Y, M+1, 0).getDate();
  let h = '<thead><tr><th style="text-align:left">Tugas</th>';
  for(let d=1; d<=nDays; d++){
    const dw = new Date(Y,M,d).getDay();
    h += '<th>'+d+'<span class="dw">'+DW[dw]+'</span></th>';
  }
  h += '</tr></thead><tbody>';
  TASKS.forEach((tk, r) => {
    h += '<tr><td class="ketc">'+(tk.no?tk.no+'. ':'')+(tk.tugas?tk.tugas+' — ':'')+tk.ket+'</td>';
    for(let d=1; d<=nDays; d++){
      const dw = new Date(Y,M,d).getDay();
      const isSun = dw===0;
      const isSched = tk.days && tk.days.includes(dw);
      const foto = photos[r+'-'+d];
      let cls = 'day' + (isSun?' sun':'') + (isSched&&!foto?' sched':'') + (foto?' done':'');
      h += '<td class="'+cls+'">'+(foto?'<img src="'+foto+'">':'')+'</td>';
    }
    h += '</tr>';
  });
  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
  document.getElementById('summary').textContent = 'Total bukti foto '+BULAN[M]+' '+Y+': '+Object.keys(photos).length;
}

// ===== Kamera senyap (live preview + jepret via canvas, tanpa suara shutter) =====
let cameraStream = null;
async function openCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('⚠ Kamera tidak tersedia di browser ini');
    return;
  }
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    const video = document.getElementById('camVideo');
    video.srcObject = cameraStream;
    document.getElementById('cameraModal').classList.add('show');
  }catch(e){
    toast('⚠ Tidak bisa akses kamera — izin ditolak atau tidak tersedia');
  }
}
function closeCameraModal(){
  document.getElementById('cameraModal').classList.remove('show');
  if(cameraStream){
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}
async function capturePhotoFromCamera(){
  if(!activeCell) return;
  const video = document.getElementById('camVideo');
  const cv = document.getElementById('camCanvas');
  const maxW = 720;
  const vw = video.videoWidth || maxW, vh = video.videoHeight || maxW;
  const scale = Math.min(1, maxW / vw);
  cv.width = Math.round(vw * scale);
  cv.height = Math.round(vh * scale);
  cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height);
  const dataUrl = cv.toDataURL('image/jpeg', 0.65);
  const id = activeCell.r+'-'+activeCell.d;
  photos[id] = dataUrl;
  await store.set(mkey()+'-foto-'+id, dataUrl);
  await saveIndex();
  renderAll();
  toast('✓ Bukti foto tanggal '+activeCell.d+' tersimpan');
  closeCameraModal();
}


// ===== Modal =====
function openModal(id){
  const [r,d] = id.split('-').map(Number);
  document.getElementById('modalTitle').textContent = TASKS[r].ket+' — '+d+' '+BULAN[M]+' '+Y;
  document.getElementById('modalImg').src = photos[id];
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function retakePhoto(){ closeModal(); openCamera(); }
async function deletePhoto(){
  if(!activeCell) return;
  const id = activeCell.r+'-'+activeCell.d;
  delete photos[id];
  await store.del(mkey()+'-foto-'+id);
  await saveIndex();
  renderAll(); closeModal();
  toast('Foto dihapus');
}
async function quickDeletePhoto(r, d){
  if(!confirm('Hapus foto ini?')) return;
  const id = r+'-'+d;
  delete photos[id];
  await store.del(mkey()+'-foto-'+id);
  await saveIndex();
  renderAll();
  toast('Foto dihapus');
}
async function resetDay(){
  const ids = TASKS.map((_,r) => r+'-'+D).filter(id => photos[id]);
  if(!ids.length){ toast('Tidak ada foto untuk tanggal ini'); return; }
  if(!confirm('Hapus semua foto ('+ids.length+') untuk tanggal '+D+' '+BULAN[M]+' '+Y+'?')) return;
  for(const id of ids){ delete photos[id]; await store.del(mkey()+'-foto-'+id); }
  await saveIndex();
  renderAll();
  toast('Semua foto tanggal '+D+' dihapus');
}
document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });
document.getElementById('cameraModal').addEventListener('click', e => { if(e.target.id==='cameraModal') closeCameraModal(); });

// ===== Share WA & hapus semua =====
async function ensureH2C(){
  if(window.html2canvas) return;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
function ringkasanText(){
  let tot = Object.keys(photos).length, sched = 0;
  const nDays = new Date(Y,M+1,0).getDate();
  TASKS.forEach(tk => {
    for(let d=1; d<=nDays; d++){
      const dw = new Date(Y,M,d).getDay();
      if(tk.days && tk.days.includes(dw)) sched++;
    }
  });
  const nama = document.getElementById('inpPetugas').value.trim() || '-';
  return '*CHECKLIST TUGAS HARIAN OB*\nPetugas: '+nama+'\nPeriode: '+BULAN[M]+' '+Y+'\nBukti foto terisi: '+tot+' dari '+sched+' jadwal';
}
async function shareWA(){
  try{
    await ensureH2C();
    toast('Membuat gambar rekap...');
    showPage('rekap');
    await new Promise(r => setTimeout(r, 150));
    const el = document.getElementById('rekapBox');
    const canvas = await html2canvas(el, {scale:3, backgroundColor:'#ffffff',
      windowWidth: document.getElementById('tbl').scrollWidth + 40,
      width: document.getElementById('tbl').scrollWidth + 2});
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const file = new File([blob], 'Checklist_OB_'+BULAN[M]+'_'+Y+'.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Checklist Tugas OB', text: ringkasanText()});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  window.open('https://wa.me/?text='+encodeURIComponent(ringkasanText()), '_blank');
}
function ringkasanTextDay(){
  const dw = new Date(Y, M, D).getDay();
  let sched = 0, done = 0;
  TASKS.forEach((tk, r) => {
    if(tk.days && tk.days.includes(dw)){
      sched++;
      if(photos[r+'-'+D]) done++;
    }
  });
  const nama = document.getElementById('inpPetugas').value.trim() || '-';
  return '*CHECKLIST TUGAS HARIAN OB*\nPetugas: '+nama+'\nTanggal: '+D+' '+BULAN[M]+' '+Y+' ('+NAMAHARI[dw]+')\nBukti foto terisi: '+done+' dari '+sched+' jadwal';
}
async function shareWADay(){
  try{
    await ensureH2C();
    toast('Membuat gambar rekap hari ini...');
    const el = document.getElementById('harianBox');
    const canvas = await html2canvas(el, {scale:3, backgroundColor:'#ffffff'});
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const file = new File([blob], 'Checklist_OB_'+D+'_'+BULAN[M]+'_'+Y+'.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Checklist Tugas OB', text: ringkasanTextDay()});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  window.open('https://wa.me/?text='+encodeURIComponent(ringkasanTextDay()), '_blank');
}
const ADMIN_PASSWORD = 'admin321';
function checkAdminPassword(){
  const pw = prompt('Masukkan password:');
  if(pw === null) return false;
  if(pw !== ADMIN_PASSWORD){ toast('Password salah'); return false; }
  return true;
}
async function resetMonth(){
  if(!checkAdminPassword()) return;
  if(!confirm('Hapus semua bukti foto untuk '+BULAN[M]+' '+Y+'?')) return;
  for(const id of Object.keys(photos)) await store.del(mkey()+'-foto-'+id);
  photos = {};
  await saveIndex();
  renderAll();
  toast('Semua foto '+BULAN[M]+' '+Y+' dihapus');
}
async function resetAllPhotos(){
  if(!checkAdminPassword()) return;
  if(!confirm('Hapus SEMUA bukti foto di SEMUA bulan & tahun? Tindakan ini tidak bisa dibatalkan.')) return;
  for(let y=2025; y<=2030; y++){
    for(let m=0; m<12; m++){
      const key = 'ob-'+y+'-'+String(m+1).padStart(2,'0');
      const idxRaw = await store.get(key+'-idx');
      const idx = idxRaw ? JSON.parse(idxRaw) : [];
      for(const id of idx) await store.del(key+'-foto-'+id);
      if(idx.length) await store.set(key+'-idx', JSON.stringify([]));
    }
  }
  photos = {};
  renderAll();
  toast('Semua foto di semua bulan telah dihapus');
}

// ===== Navigasi & init =====
function showPage(which){
  document.getElementById('pageHarian').classList.toggle('active', which==='harian');
  document.getElementById('pageRekap').classList.toggle('active', which==='rekap');
  document.getElementById('tabHarian').classList.toggle('active', which==='harian');
  document.getElementById('tabRekap').classList.toggle('active', which==='rekap');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

const sm = document.getElementById('selMonth'), sy = document.getElementById('selYear');
BULAN.forEach((b,i)=> sm.add(new Option(b, i)));
for(let y=2025; y<=2030; y++) sy.add(new Option(y, y));
const now = new Date();
M = now.getMonth(); Y = now.getFullYear(); D = now.getDate();
sm.value = M; sy.value = Y;
sm.onchange = ()=>{ M=+sm.value; D=Math.min(D, new Date(Y,M+1,0).getDate()); load(); };
sy.onchange = ()=>{ Y=+sy.value; D=Math.min(D, new Date(Y,M+1,0).getDate()); load(); };

const inpPetugas = document.getElementById('inpPetugas');
async function loadPetugas(){
  const v = await store.get(mkey()+'-petugas');
  inpPetugas.value = v || '';
}
inpPetugas.addEventListener('change', () => store.set(mkey()+'-petugas', inpPetugas.value.trim()));

load();
